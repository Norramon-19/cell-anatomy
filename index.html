<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Cell Anatomy — Interactive 3D Cell Explorer by Tanaporn Taneeprasert M3.1 No18</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('cell-anatomy-theme');
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme: dark;
  --bg-app:#0c1119; --bg-panel:#121826; --bg-panel-2:#161e2e; --bg-raised:#1b2436;
  --border:#232e42; --border-soft:#1a2334;
  --text-primary:#eef1f6; --text-secondary:#93a1b7; --text-tertiary:#59667d;
  --copper:#dd9553; --copper-dim:rgba(221,149,83,0.14); --copper-line:rgba(221,149,83,0.35);
  --cyan:#5fe1cd; --cyan-dim:rgba(95,225,205,0.14);
  --overlay-bg:rgba(18,24,38,0.9); --scrollbar-thumb:#2a3448; --hover-border:#3a4763;
  --font-display:'Space Grotesk', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
[data-theme="light"]{
  color-scheme: light;
  --bg-app:#eef1f6; --bg-panel:#ffffff; --bg-panel-2:#f7f9fc; --bg-raised:#eef2f8;
  --border:#dbe1ea; --border-soft:#e9edf3;
  --text-primary:#141b26; --text-secondary:#4d5a6e; --text-tertiary:#8592a6;
  --copper:#b26a25; --copper-dim:rgba(178,106,37,0.10); --copper-line:rgba(178,106,37,0.40);
  --cyan:#0e9384; --cyan-dim:rgba(14,147,132,0.12);
  --overlay-bg:rgba(255,255,255,0.94); --scrollbar-thumb:#c9d2de; --hover-border:#b9c4d4;
}
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{ font-family:var(--font-display); background:var(--bg-app); color:var(--text-primary); overflow:hidden; width:100vw; height:100vh; transition:background-color .22s ease, color .22s ease; }
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--scrollbar-thumb); border-radius:4px; }
#app{ display:grid; grid-template-columns:272px 1fr 320px; grid-template-rows:56px 1fr; height:100vh; width:100vw; background:var(--bg-app); }
#header{ grid-column:1/4; grid-row:1/2; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--bg-panel); border-bottom:1px solid var(--border); z-index:20; gap:16px; transition:background-color .22s ease, border-color .22s ease; }
#brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
#brand svg{ display:block; }
.logo-back{ stroke:var(--text-tertiary); }
.logo-front{ fill:var(--bg-panel-2); stroke:var(--copper); }
#brand .name{ font-size:15px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; }
#brand .tagline{ font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); margin-top:1px; white-space:nowrap; }
#device-tabs{ display:flex; gap:6px; }
#device-tabs button{ display:flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--border); color:var(--text-secondary); font-family:var(--font-display); font-size:12.5px; font-weight:500; padding:7px 14px; border-radius:7px; cursor:pointer; transition:.15s; white-space:nowrap; }
#device-tabs button:hover{ border-color:var(--hover-border); color:var(--text-primary); }
#device-tabs button.active{ background:var(--copper-dim); border-color:var(--copper-line); color:var(--copper); }
#device-tabs button .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.55; }
#header-actions{ display:flex; gap:8px; flex-shrink:0; align-items:center; }
#header-actions button{ background:transparent; border:1px solid var(--border); color:var(--text-secondary); font-family:var(--font-mono); font-size:11px; padding:7px 12px; border-radius:7px; cursor:pointer; transition:.15s; }
#header-actions button:hover{ border-color:var(--hover-border); color:var(--text-primary); }
#btn-theme{ display:inline-flex; align-items:center; justify-content:center; width:32px; padding:7px 0 !important; }
#btn-theme .icon-sun{ display:block; } #btn-theme .icon-moon{ display:none; }
[data-theme="light"] #btn-theme .icon-sun{ display:none; }
[data-theme="light"] #btn-theme .icon-moon{ display:block; }
#left-panel{ grid-column:1/2; grid-row:2/3; background:var(--bg-panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.panel-section{ padding:16px 16px 14px; }
.panel-section + .panel-section{ border-top:1px solid var(--border-soft); }
.panel-title{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:10px; }
#layer-list{ list-style:none; overflow-y:auto; flex:1; padding:4px 10px 10px; }
#layer-list li{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:6px; cursor:pointer; transition:.12s; }
#layer-list li:hover{ background:var(--bg-raised); }
#layer-list li.hovered{ background:var(--cyan-dim); }
#layer-list li.selected{ background:var(--copper-dim); }
#layer-list .idx{ font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); width:18px; flex-shrink:0; }
#layer-list li.selected .idx{ color:var(--copper); }
#layer-list .meta{ min-width:0; flex:1; }
#layer-list .name{ font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#layer-list .material{ font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#spec-sheet{ padding:14px 16px 18px; }
#spec-sheet .spec-row{ display:flex; justify-content:space-between; gap:10px; font-size:11.5px; padding:6px 0; border-bottom:1px solid var(--border-soft); color:var(--text-secondary); }
#spec-sheet .spec-row:last-child{ border-bottom:none; }
#spec-sheet .spec-row span:first-child{ color:var(--text-tertiary); }
#spec-sheet .spec-row span:last-child{ font-family:var(--font-mono); font-size:11px; color:var(--text-primary); text-align:right; }
#viewport{ grid-column:2/3; grid-row:2/3; position:relative; background:var(--bg-app); overflow:hidden; }
#viewport canvas{ display:block; }
.vp-overlay{ position:absolute; pointer-events:none; }
#vp-topleft{ top:16px; left:18px; font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); line-height:1.6; }
#vp-topleft .device-name{ font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--text-primary); }
#view-presets{ top:16px; right:18px; display:flex; gap:6px; pointer-events:auto; }
#view-presets button{ background:var(--overlay-bg); border:1px solid var(--border); color:var(--text-secondary); font-family:var(--font-mono); font-size:10.5px; padding:6px 11px; border-radius:6px; cursor:pointer; backdrop-filter:blur(4px); transition:.15s; }
#view-presets button:hover{ border-color:var(--hover-border); color:var(--text-primary); }
#decon-wrap{ bottom:22px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; background:var(--overlay-bg); border:1px solid var(--border); border-radius:10px; padding:10px 18px; backdrop-filter:blur(6px); pointer-events:auto; min-width:380px; }
#decon-wrap label{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
#decon-slider{ flex:1; accent-color:var(--copper); cursor:pointer; }
#decon-value{ font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--copper); width:38px; text-align:right; }
.decon-chips{ display:flex; gap:4px; }
.decon-chips button{ background:transparent; border:1px solid var(--border); color:var(--text-tertiary); font-family:var(--font-mono); font-size:10px; padding:3px 8px; border-radius:5px; cursor:pointer; transition:.15s; }
.decon-chips button:hover{ border-color:var(--copper-line); color:var(--copper); }
#hover-tip{ position:fixed; pointer-events:none; background:var(--overlay-bg); border:1px solid var(--border); color:var(--text-primary); font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:6px; display:none; z-index:50; backdrop-filter:blur(4px); }
#right-panel{ grid-column:3/4; grid-row:2/3; background:var(--bg-panel); border-left:1px solid var(--border); padding:18px 18px 20px; overflow-y:auto; }
#inspector-eyebrow{ font-family:var(--font-mono); font-size:10.5px; color:var(--copper); letter-spacing:.06em; margin-bottom:8px; min-height:14px; }
#inspector-name{ font-size:20px; font-weight:600; letter-spacing:-0.01em; margin-bottom:10px; line-height:1.25; }
#inspector-material{ display:inline-block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); background:var(--bg-raised); border:1px solid var(--border); padding:4px 10px; border-radius:20px; margin-bottom:14px; }
#inspector-desc{ font-size:13.5px; line-height:1.65; color:var(--text-secondary); }
#inspector-hint{ margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft); font-family:var(--font-mono); font-size:10.5px; color:var(--text-tertiary); line-height:1.7; }
@media (max-width:980px){ #app{ grid-template-columns:220px 1fr 260px; } #decon-wrap{ min-width:260px; } }
@media (max-width:760px){
  #app{ grid-template-columns:1fr; grid-template-rows:56px 1fr auto; }
  #left-panel{ display:none; }
  #viewport{ grid-column:1/2; grid-row:2/3; }
  #right-panel{ grid-column:1/2; grid-row:3/4; border-left:none; border-top:1px solid var(--border); max-height:34vh; }
  #device-tabs button span.label{ display:none; }
  #decon-wrap{ min-width:0; width:calc(100% - 32px); }
}
</style>
</head>

  <aside id="right-panel">

</div>
